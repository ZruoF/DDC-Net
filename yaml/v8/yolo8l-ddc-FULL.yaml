# Ultralytics YOLOv8 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
  m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
  l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
  x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

# YOLOv8-L backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32, capped to 512 by scale l
  - [-1, 3, C2f, [1024, True]]     # 8-P5/32, capped to 512 by scale l
  - [-1, 1, SPPF, [1024, 5]]       # 9-P5/32, capped to 512 by scale l

# Head: P2 + BHFP + DDCGFLM
head:
  # Backbone feature taps:
  # 2: P2/4, 4: P3/8, 6: P4/16, 9: P5/32

  # Channel alignment before BHFP fusion.
  # Under scale=l, these remain 256 channels.
  - [2, 1, Conv, [256, 1, 1]]      # 10 P2a
  - [4, 1, Conv, [256, 1, 1]]      # 11 P3a
  - [6, 1, Conv, [256, 1, 1]]      # 12 P4a
  - [9, 1, Conv, [256, 1, 1]]      # 13 P5a

  # Top-down path: P5 -> P2
  - [13, 1, nn.Upsample, [None, 2, "nearest"]]   # 14 up P5a -> P4
  - [[14, 12], 1, MeanFuse, []]                  # 15 mean(upP5a, P4a)
  - [-1, 3, C2f, [256]]                          # 16 TD4

  - [16, 1, nn.Upsample, [None, 2, "nearest"]]   # 17 up TD4 -> P3
  - [[17, 11], 1, MeanFuse, []]                  # 18 mean(upTD4, P3a)
  - [-1, 3, C2f, [256]]                          # 19 TD3

  - [19, 1, nn.Upsample, [None, 2, "nearest"]]   # 20 up TD3 -> P2
  - [[20, 10], 1, MeanFuse, []]                  # 21 mean(upTD3, P2a)
  - [-1, 3, C2f, [256]]                          # 22 TD2 => P2_out

  # Bottom-up path with backbone skip: P2 -> P5
  - [22, 1, Conv, [256, 3, 2]]                   # 23 down P2_out -> P3
  - [[23, 19, 11], 1, MeanFuse, []]              # 24 mean(downP2, TD3, P3a)
  - [-1, 3, C2f, [256]]                          # 25 BU3 => P3_out

  - [25, 1, Conv, [256, 3, 2]]                   # 26 down P3_out -> P4
  - [[26, 16, 12], 1, MeanFuse, []]              # 27 mean(downP3, TD4, P4a)
  - [-1, 3, C2f, [256]]                          # 28 BU4 => P4_out

  - [28, 1, Conv, [256, 3, 2]]                   # 29 down P4_out -> P5
  - [[29, 13], 1, MeanFuse, []]                  # 30 mean(downP4, P5a)
  - [-1, 3, C2f, [256]]                          # 31 BU5 => P5_out

  # DDCGFLM + MSADBlock on each BHFP output.
  # P2 branch
  - [22, 1, DDCGFLM, [256, 3]]                   # 32 P2 after DDCGFLM
  - [-1, 1, MSADBlock, [256, 4, [1, 3, 5, 7]]]   # 33 P2'

  # P3 branch
  - [25, 1, DDCGFLM, [256, 3]]                   # 34 P3 after DDCGFLM
  - [-1, 1, MSADBlock, [256, 4, [1, 3, 5, 7]]]   # 35 P3'

  # P4 branch
  - [28, 1, DDCGFLM, [256, 3]]                   # 36 P4 after DDCGFLM
  - [-1, 1, MSADBlock, [256, 4, [1, 3, 5, 7]]]   # 37 P4'

  # P5 branch
  - [31, 1, DDCGFLM, [256, 3]]                   # 38 P5 after DDCGFLM
  - [-1, 1, MSADBlock, [256, 4, [1, 3, 5, 7]]]   # 39 P5'

  # Detect on MSADBlock outputs
  - [[33, 35, 37, 39], 1, Detect, [nc]]          # 40 Detect(P2, P3, P4, P5)